plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.0'
	id 'io.spring.dependency-management' version '1.1.0'
	id 'application'
	id 'checkstyle'
  id 'jacoco'
	id 'maven-publish'
}

group = 'cn.ac.bmi.cloudphr'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'org.jsoup:jsoup:1.16.1'
	implementation 'cn.hutool:hutool-all:5.8.19'
	implementation 'org.openehr.java-libs:openehr-aom:1.0.71'
	implementation 'org.openehr.java-libs:adl-parser:1.0.71'
	implementation 'org.openehr.java-libs:adl-serializer:1.0.71'
	implementation 'org.openehr.java-libs:oet-parser:1.0.71'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.enabled = true
  }
}

checkstyle {
	toolVersion = '10.12.0'
	configFile = project(':').file('config/checkstyle/checkstyle.xml')
	configProperties = [ "suppressionFile" : project(':').file('config/checkstyle/suppressions.xml')]
}

application {
	mainClassName = 'cn.ac.bmi.cloudphr.web.MindEHR'
}

jar {
	enabled = true
}

def newArtifactId = rootProject.name.replace('.', '-')

publishing {
	repositories {
		maven {
			name = "GitHubPackages"
			url = "https://maven.pkg.github.com/cloudphr/mindehr"
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}

	publications {
		bootJava(MavenPublication) {
			artifact bootJar
			artifactId "${newArtifactId}"
		}
		gpr(MavenPublication) {
			from(components.java)
			artifactId "${newArtifactId}"
		}
	}
}
